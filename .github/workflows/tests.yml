name: Mojo and Python tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # Linux CPU only: GPU tests skip themselves via has_accelerator().
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          locked: true
          cache: true
      - name: Mojo version
        run: pixi run mojo-version
      - name: Mojo tests, Python bindings and pytest
        run: pixi run test
      - name: Validate static site builds
        run: pixi run docs-build
