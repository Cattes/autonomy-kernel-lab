[workspace]
name = "autonomy-kernel-lab-gpu"
# Nightly MAX packages use metadata older pixi versions cannot parse.
requires-pixi = ">=0.84"
channels = ["https://conda.modular.com/max/", "conda-forge"]
platforms = ["osx-arm64"]

# Default environment: latest *stable* MAX/Mojo release (what the official
# GPU tutorial targets). Use this for lesson work.
[feature.stable.dependencies]
max = "==26.7"

# Optional bleeding-edge environment from the nightly channel:
#   pixi run -e nightly mojo --version
# Refresh it to today's nightly with: pixi update -e nightly
[feature.nightly]
channels = [{ channel = "https://conda.modular.com/max-nightly/", priority = 10 }]

[feature.nightly.dependencies]
max = ">=26.8.0.dev0"

[environments]
default = ["stable"]
nightly = ["nightly"]

[tasks]
mojo-version = "mojo --version"
